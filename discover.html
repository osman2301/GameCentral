<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover · GameCentral</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== TOP BAR: logo, page links, Add Game ===== -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="index.html" class="brand">
                <div class="brand-icon">G</div>
                <span>GameCentral</span>
            </a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="library.html">Library</a>
                <a href="discover.html" class="active">Discover</a>
            </nav>
        </div>
        <div class="topbar-right">
            <button class="install-button" id="open-add-game">+ Add Game</button>
        </div>
    </header>

    <div class="app-layout">
        <!-- ===== DISCOVER PAGE: random pick, backlog ===== -->
        <main class="library-main">
            <section class="library-toolbar">
                <div>
                    <p class="small-title">GAMECENTRAL</p>
                    <h1>Discover</h1>
                </div>
            </section>

            <section class="disc-section">
                <h2>Pick something for me</h2>
                <p class="disc-note">Can't decide? Let the library choose.</p>
                <div class="filter-panel">
                    <div class="filter-field">
                        <label for="pick-mood">I'm feeling…</label>
                        <select id="pick-mood">
                            <option>Any Mood</option> <!-- the moods are added by GameFilter, from GameFilter.MOODS -->
                        </select>
                    </div>
                    <div class="filter-field">
                        <label for="pick-time">How much time do I have?</label>
                        <select id="pick-time">
                            <option>Any Time</option> <!-- the choices are added by GameFilter, from GameFilter.TIME_OPTIONS -->
                        </select>
                    </div>
                    <button class="toolbar-button" id="filter-button">Filter</button>
                    <button class="match-button" id="pick-button">Surprise me</button>
                </div>
                <p class="disc-note" id="mood-status"></p> <!-- "Looking up games…" etc. -->
                <div id="pick-result"></div>
            </section>

            <div id="discover-content"></div> <!-- "Worth revisiting", filled in by the script -->

            <footer class="library-footer">
                <span>GameCentral</span>
                <span>Game info from <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a></span>
            </footer>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="Game.js"></script>
    <script src="CentralLibrary.js"></script>
    <script src="PlatformLibrary.js"></script>
    <script src="OriginalPlatform.js"></script>
    <script src="LaunchController.js"></script>
    <script src="ImportController.js"></script>
    <script src="GameInfo.js"></script>
    <script src="GameFilter.js"></script>
    <script>
        // ================================================================
        // App state
        // ================================================================
        var games = [];          // every game in your library (Game objects, see Game.js)
        var selectedIndex = -1;  // which game is shown on the Library page (-1 = none)

        // Colour styles handed out to game icons/cards in turn
        var iconColors = ['icon-blue', 'icon-teal', 'icon-orange', 'icon-purple', 'icon-green', 'icon-red', 'icon-gold'];
        var shelfCovers = ['cover-one', 'cover-two', 'cover-three', 'cover-four'];
        var gridCovers = ['cover-five', 'cover-six', 'cover-seven', 'cover-eight', 'cover-nine', 'cover-ten'];

        // Each page replaces these:
        var renderPage = function () {};                         // redraw the page
        var onGameAdded = function (index) { renderPage(); };    // after "+ Add Game"

        // ================================================================
        // Small helpers for showing text
        // ================================================================

        // Minutes -> "45 min" / "2.5 hours"
        function formatPlayTime(totalMinutes) {
            var minutes = totalMinutes || 0;
            if (minutes < 1) return '0 hours';
            if (minutes < 60) return Math.round(minutes) + ' min';
            var rounded = Math.round(minutes / 60 * 10) / 10;
            return rounded + (rounded === 1 ? ' hour' : ' hours');
        }

        // Date -> "Just now" / "5m ago" / "3h ago" / "2d ago"
        function formatLastPlayed(timestamp) {
            if (!timestamp) return 'Never';
            var diffMs = Date.now() - timestamp;
            if (diffMs < 60000) return 'Just now';
            if (diffMs < 3600000) return Math.floor(diffMs / 60000) + 'm ago';
            if (diffMs < 86400000) return Math.floor(diffMs / 3600000) + 'h ago';
            return Math.floor(diffMs / 86400000) + 'd ago';
        }

        // "Risk of Rain" -> "RO" (shown on the coloured squares)
        function initials(name) {
            var words = name.trim().split(/\s+/);
            if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
            return (words[0][0] + words[1][0]).toUpperCase();
        }

        function emptyMessage(text) {
            var p = document.createElement('p');
            p.className = 'empty-state';
            p.textContent = text;
            return p;
        }

        function isUnplayed(g) { return !g.lastPlayedAt && !(g.totalMinutes > 0); }

        // Positions of games that pass a test, optionally sorted and limited
        function pickIndexes(filterFn, cmp, limit) {
            var idx = [];
            games.forEach(function (g, i) { if (!filterFn || filterFn(g)) idx.push(i); });
            if (cmp) idx.sort(cmp);
            return limit ? idx.slice(0, limit) : idx;
        }

        function note_played(g) { return 'Played ' + formatLastPlayed(g.lastPlayedAt) + ' · ' + formatPlayTime(g.totalMinutes); }
        // Genres from Wikidata (e.g. "Roguelike, Action role-playing"), '' until the game has been looked up
        function genreLabel(g, max) { return gameInfo ? gameInfo.genreLabel(g, max) : ''; }
        // "Steam · Roguelike, Action role-playing" (just "Steam" until the genre is known)
        function note_platform(g) { var genre = genreLabel(g); return g.platform + (genre ? ' · ' + genre : ''); }

        // Opens a game on the Library page (library.html?game=3)
        function openGame(index) {
            window.location.href = 'library.html?game=' + index;
        }

        // ================================================================
        // Small game cards (Home, Discover, "Surprise me")
        // Their button is ▶ Play, or ⬇ Install if the game isn't installed
        // ================================================================
        function miniCard(i, note) {
            var g = games[i];
            var card = document.createElement('article');
            card.className = 'mini-card';
            var cover = document.createElement('div');
            cover.className = 'mini-cover ' + shelfCovers[i % shelfCovers.length];
            cover.textContent = initials(g.title);
            cover.addEventListener('click', function () { openGame(i); });
            var body = document.createElement('div');
            body.className = 'mini-body';
            var name = document.createElement('strong');
            name.textContent = g.title;
            name.addEventListener('click', function () { openGame(i); });
            var sub = document.createElement('span');
            sub.textContent = note;
            var play = document.createElement('button');
            play.type = 'button';
            play.className = 'play-button play-button-small';
            LaunchController.styleActionButton(play, g); // ▶ Play or ⬇ Install
            play.addEventListener('click', function () { launcher.processAction(games[i].id); });
            body.appendChild(name);
            body.appendChild(sub);
            body.appendChild(play);
            card.appendChild(cover);
            card.appendChild(body);
            return card;
        }

        // A heading + grid of mini cards (or null if there are no games)
        function gameSection(title, idxs, noteFn, className) {
            if (!idxs.length) return null;
            var sec = document.createElement('section');
            sec.className = className;
            var h = document.createElement('h2');
            h.textContent = title;
            var grid = document.createElement('div');
            grid.className = 'mini-grid';
            idxs.forEach(function (i) { grid.appendChild(miniCard(i, noteFn(games[i]))); });
            sec.appendChild(h);
            sec.appendChild(grid);
            return sec;
        }

        // ================================================================
        // The library (see CentralLibrary.js). It's saved in the browser,
        // so every page sees the same games.
        // ================================================================
        var library = new CentralLibrary();
        games = library.games;

        // ================================================================
        // ADD GAME WINDOW (opened by "+ Add Game")
        // Written once here and added to every page, so the pages stay short.
        // (Backslashes are doubled because this is inside a JS string.)
        // ================================================================
        document.body.insertAdjacentHTML('beforeend', `
        <div class="modal-backdrop" id="add-game-backdrop">
            <div class="modal add-game-modal">
                <div class="modal-header">
                    <h2>Add a Game</h2>
                    <button type="button" class="modal-close" id="close-add-game" aria-label="Close">×</button>
                </div>
                <form id="add-game-form">
                    <!-- 1. Platform -->
                    <div class="filter-field">
                        <label for="new-game-platform">Platform</label>
                        <select id="new-game-platform">
                            <option>Steam</option>
                            <option>Epic Games</option>
                            <option>Battle.net</option>
                        </select>
                    </div>

                    <!-- 2. Pick from installed games (only the chosen platform's box is shown) -->
                    <section class="import-card" id="steam-import-row" style="display:none;">
                        <div class="import-card-head">
                            <span class="import-card-title">Installed Steam games</span>
                            <button type="button" class="link-button" id="steam-clear-button" style="display:none;">Clear list</button>
                        </div>
                        <div class="import-card-pick">
                            <select id="steam-game-select" aria-label="Installed Steam games"></select>
                            <button type="button" class="toolbar-button" id="steam-files-button">Load…</button>
                        </div>
                        <input type="file" id="steam-files-input" accept=".acf" multiple hidden>
                        <p class="field-hint status" id="steam-import-status"></p>
                        <details class="help">
                            <summary>Where are these files?</summary>
                            <p>Click <b>Load…</b>, open <code>C:\\Program Files (x86)\\Steam\\steamapps</code> and select all the <code>appmanifest_….acf</code> files. Another Steam library (e.g. <code>D:\\SteamLibrary\\steamapps</code>)? Load it too — it adds to the list.</p>
                        </details>
                    </section>


                    <section class="import-card" id="steam-all-row" style="display:none;">
                        <div class="import-card-head">
                            <span class="import-card-title">All Steam games <span class="optional">installed or not</span></span>
                        </div>
                        <input type="text" id="steam-all-search" class="search-input" placeholder="Search or pick a Steam game…" autocomplete="off" spellcheck="false"
                               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="steam-all-results" aria-label="Search every Steam game">
                        <ul class="search-results" id="steam-all-results" role="listbox" hidden></ul>
                        <p class="field-hint status" id="steam-all-status"></p>
                    </section>

                    <section class="import-card" id="epic-import-row" style="display:none;">
                        <div class="import-card-head">
                            <span class="import-card-title">Installed Epic games</span>
                            <button type="button" class="link-button" id="epic-clear-button" style="display:none;">Clear list</button>
                        </div>
                        <div class="import-card-pick">
                            <select id="epic-game-select" aria-label="Installed Epic games"></select>
                            <button type="button" class="toolbar-button" id="epic-folder-button">Load…</button>
                        </div>
                        <input type="file" id="epic-folder-input" webkitdirectory multiple hidden>
                        <p class="field-hint status" id="epic-import-status"></p>
                        <details class="help">
                            <summary>Where are these files?</summary>
                            <p>Click <b>Load…</b> and paste <code>C:\\ProgramData\\Epic\\EpicGamesLauncher\\Data\\Manifests</code> into the address bar (ProgramData is hidden). Game missing? Load the folder your games are installed in instead, e.g. <code>D:\\Epic Games</code>.</p>
                        </details>
                    </section>

                    <section class="import-card" id="epic-owned-row" style="display:none;">
                        <div class="import-card-head">
                            <span class="import-card-title">Your Epic library <span class="optional">installed or not</span></span>
                            <button type="button" class="link-button" id="epic-owned-clear-button" style="display:none;">Clear list</button>
                        </div>
                        <div class="import-card-pick">
                            <select id="epic-owned-select" aria-label="Games in your Epic library"></select>
                            <button type="button" class="toolbar-button" id="epic-owned-button">Load…</button>
                        </div>
                        <input type="file" id="epic-owned-input" accept=".bin" hidden>
                        <p class="field-hint status" id="epic-owned-status"></p>
                        <input type="text" id="epic-owned-search" class="search-input search-under-pick" placeholder="Load your Epic library to search it" autocomplete="off" spellcheck="false" disabled
                               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="epic-owned-results" aria-label="Search your Epic library">
                        <ul class="search-results" id="epic-owned-results" role="listbox" hidden></ul>
                        <p class="field-hint status" id="epic-owned-search-status"></p>
                        <details class="help">
                            <summary>Where is this file?</summary>
                            <p>Open the Epic Games Launcher first so its list is up to date. Then click <b>Load…</b>, paste <code>C:\\ProgramData\\Epic\\EpicGamesLauncher\\Data\\Catalog</code> into the address bar (ProgramData is hidden) and pick <code>catcache.bin</code>. It lists every game on your Epic account, so games you haven't installed get an Install button.</p>
                        </details>
                    </section>

                    <section class="import-card" id="battle-import-row" style="display:none;">
                        <div class="import-card-head">
                            <span class="import-card-title">Installed Battle.net games</span>
                            <button type="button" class="link-button" id="battle-clear-button" style="display:none;">Clear list</button>
                        </div>
                        <div class="import-card-pick">
                            <select id="battle-game-select" aria-label="Installed Battle.net games"></select>
                            <button type="button" class="toolbar-button" id="battle-files-button">Load…</button>
                        </div>
                        <input type="file" id="battle-files-input" accept=".db" hidden>
                        <p class="field-hint status" id="battle-import-status"></p>
                        <details class="help">
                            <summary>Where is this file?</summary>
                            <p>Click <b>Load…</b>, paste <code>C:\\ProgramData\\Battle.net\\Agent</code> into the address bar (ProgramData is hidden) and pick <code>product.db</code>. Not installed yet? Find it in <b>All Battle.net games</b> below.</p>
                        </details>
                    </section>

                    <section class="import-card" id="battle-all-row" style="display:none;">
                        <div class="import-card-head">
                            <span class="import-card-title">All Battle.net games <span class="optional">installed or not</span></span>
                        </div>
                        <input type="text" id="battle-all-search" class="search-input" placeholder="Search or pick a Battle.net game…" autocomplete="off" spellcheck="false"
                               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="battle-all-results" aria-label="Search every Battle.net game">
                        <ul class="search-results" id="battle-all-results" role="listbox" hidden></ul>
                        <p class="field-hint status" id="battle-all-status"></p>
                    </section>

                    <div class="form-divider"><span>Game details</span></div>

                    <!-- 3. Name and Launch ID -->
                    <div class="filter-field">
                        <label for="new-game-name">Game Name</label>
                        <input type="text" id="new-game-name" placeholder="Pick a game above" readonly tabindex="-1">
                    </div>
                    <div class="filter-field">
                        <label for="new-game-launch-id">Launch ID <span class="optional">filled in from the game you pick</span></label>
                        <input type="text" id="new-game-launch-id" placeholder="Pick a game above" readonly tabindex="-1">
                        <p class="field-hint status" id="steam-lookup-status"></p>
                        <p class="field-hint status" id="epic-lookup-status"></p>
                        <p class="field-hint status" id="battle-lookup-status"></p>
                        <p class="field-hint" id="launch-id-hint"></p>
                    </div>


                    <div class="modal-actions">
                        <button type="button" class="toolbar-button" id="cancel-add-game">Cancel</button>
                        <button type="submit" class="match-button">Add Game</button>
                    </div>
                </form>
            </div>
        </div>`);

        // ================================================================
        // Adding games (see ImportController.js and PlatformLibrary.js)
        // ================================================================
        new ImportController({
            library: library,
            platformLibrary: new PlatformLibrary(),
            onGameImported: function (game) { onGameAdded(games.indexOf(game)); },
            onInstalledChanged: function () { renderPage(); } // Play/Install buttons update
        });

        // ================================================================
        // Launching games (see LaunchController.js and OriginalPlatform.js)
        // The big Play button only exists on library.html; elsewhere it's null.
        // ================================================================
        var launcher = new LaunchController({
            library: library,
            platform: new OriginalPlatform(),
            playButton: document.getElementById('featured-play-button'),
            getSelectedGame: function () { return games[selectedIndex] || null; },
            onSessionEnded: function () { renderPage(); }
        });

        // ================================================================
        // Genres (and the game modes Discover's filters use) from Wikidata - see GameInfo.js.
        // Looks up games that haven't been looked up yet, then redraws.
        // ================================================================
        var gameInfo = new GameInfo({ library: library, statusEl: document.getElementById('mood-status') }); // status line only on Discover
        function lookUpGames() {
            var lookup = gameInfo.lookUpMissingGames();
            if (gameInfo.running) renderPage(); // shows "Looking up…" until it's done
            lookup.then(function (result) { if (result) renderPage(); });
        }

        // ================================================================
        // Discover: games not played for a month
        // ================================================================
        function renderDiscover() {
            var el = document.getElementById('discover-content');
            el.innerHTML = '';
            var month = 30 * 86400000;
            [
                gameSection('Worth revisiting', pickIndexes(function (g) { return g.lastPlayedAt && Date.now() - g.lastPlayedAt > month; }, function (a, b) { return games[b].totalMinutes - games[a].totalMinutes; }, 4), note_played, 'disc-section')
            ].forEach(function (sec) { if (sec) el.appendChild(sec); });
        }

        // ================================================================
        // "Pick something for me" (see GameFilter.js): mood and time
        // ================================================================
        var filter = new GameFilter({
            info: gameInfo,
            moodSelect: document.getElementById('pick-mood'),
            timeSelect: document.getElementById('pick-time')
        });

        // Look up new games on Wikidata as soon as Discover opens, and after "+ Add Game"
        lookUpGames();
        onGameAdded = function () { renderPage(); lookUpGames(); };

        // Shows a message (e.g. "None of your games feel spooked.") where the results go
        function showPickMessage(out, text) {
            var p = document.createElement('p');
            p.className = 'disc-note';
            p.textContent = text;
            out.appendChild(p);
        }

        // "Filter": show every game that matches the filters
        document.getElementById('filter-button').addEventListener('click', function () {
            var out = document.getElementById('pick-result');
            out.innerHTML = '';
            filter.filterAll().then(function (result) {
                out.innerHTML = '';
                if (result.message) { showPickMessage(out, result.message); return; }
                showPickMessage(out, result.matches.length + ' of ' + result.total + ' game' + (result.total === 1 ? '' : 's') + ' match.');
                var grid = document.createElement('div');
                grid.className = 'mini-grid';
                result.matches.forEach(function (m) {
                    grid.appendChild(miniCard(m.index, note_platform(games[m.index]) + (m.why ? ' · ' + m.why : '')));
                });
                out.appendChild(grid);
            });
        });

        // "Surprise me": show a random game that matches the filters
        document.getElementById('pick-button').addEventListener('click', function () {
            var out = document.getElementById('pick-result');
            out.innerHTML = '';
            filter.pickRandom().then(function (pick) {
                out.innerHTML = '';
                if (pick.message) { showPickMessage(out, pick.message); return; }
                // Shows why it fits, e.g. "Steam · Action · horror · ~30 min sessions"
                var card = miniCard(pick.index, note_platform(games[pick.index]) + (pick.why ? ' · ' + pick.why : ''));
                card.classList.add('pick-card');
                out.appendChild(card);
            });
        });

        renderPage = renderDiscover;
        renderPage();
    </script>
</body>
</html>
